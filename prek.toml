# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.3.8"

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-merge-conflict" },
    { id = "detect-private-key" },
    { id = "check-toml" },
    { id = "check-yaml" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "zig-download-retry-test"
name = "Zig download retry regression tests"
language = "system"
entry = "bash scripts/tests/zig-download-retry.sh"
files = "^(scripts/(with-zig-download-retry\\.sh|zig-download-retry/zig|tests/zig-download-retry\\.sh)|justfile|\\.github/workflows/ci\\.yml)$"
pass_filenames = false
priority = 5

[[repos.hooks]]
id = "parser-packer-lint"
name = "parser packer Ruff"
language = "system"
entry = "uvx ruff check scripts/compact_parser_tables.py"
files = "^scripts/compact_parser_tables\\.py$"
pass_filenames = false
priority = 5

[[repos.hooks]]
id = "fmt-check"
name = "cargo fmt --check"
language = "system"
entry = "cargo fmt --check"
always_run = true
pass_filenames = false
priority = 10

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --workspace --locked --all-targets -- -D warnings"
always_run = true
pass_filenames = false
priority = 15

[[repos.hooks]]
id = "test"
name = "cargo nextest run"
language = "system"
entry = "cargo nextest run --workspace --config-file .config/nextest.toml --cargo-quiet --failure-output final --no-tests pass"
always_run = true
pass_filenames = false
priority = 20
