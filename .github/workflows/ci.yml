name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Run rustfmt check
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          bash scripts/tests/zig-download-retry.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check hook scripts and file syntax
        shell: bash
        run: |
          set -euo pipefail
          uvx ruff check scripts/*.py
          uv run --script scripts/check-config.py self-test
          git ls-files -z -- '*.toml' '*.yaml' '*.yml' | xargs -0 uv run --script scripts/check-config.py check

  clippy:
    name: clippy (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Cargo registry cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Set up mise toolchain
        uses: jdx/mise-action@v5

      - name: Verify workflow dependency lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --verify

      - name: Validate hook configuration and basic checks
        shell: bash
        run: |
          set -euo pipefail
          mise tasks validate
          hk validate
          hk check --all --step merge-conflict --step private-key

      - name: Set up native image dependencies
        uses: $/.github/actions/setup-native-image-deps

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable sccache integration
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            echo "CC=sccache cc"
            echo "CXX=sccache c++"
          } >> "${GITHUB_ENV}"

      - name: Run clippy
        shell: bash
        run: |
          set -euo pipefail
          "${SCCACHE_PATH}" --zero-stats
          scripts/with-zig-download-retry.sh cargo clippy --timings --workspace --locked --all-targets --all-features -- -D warnings

      - name: Save Cargo registry cache
        if: always() && (github.ref_name == 'master' || steps.cargo-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Collect clippy observability artifacts
        if: always()
        uses: $/.github/actions/observability
        with:
          artifact-name: kat-clippy-observability-ubuntu-latest
          summary-title: Clippy observability
          output-dir: ${{ runner.temp }}/kat-clippy-observability

      - name: Upload clippy observability artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kat-clippy-observability-ubuntu-latest
          path: ${{ runner.temp }}/kat-clippy-observability
          if-no-files-found: warn

  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Cargo registry cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up native image dependencies
        uses: $/.github/actions/setup-native-image-deps

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable sccache integration
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            echo "CC=sccache cc"
            echo "CXX=sccache c++"
          } >> "${GITHUB_ENV}"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run test suite
        shell: bash
        env:
          KAT_LINK_LOG: ${{ runner.temp }}/test-rust-link-timings.tsv
          KAT_REAL_LINKER: cc
        run: |
          set -euo pipefail
          : > "${KAT_LINK_LOG}"
          "${SCCACHE_PATH}" --zero-stats
          export RUSTFLAGS="-Clinker=${GITHUB_WORKSPACE}/.github/scripts/rust-link-wrapper.sh"
          cargo nextest run \
            --timings \
            --workspace \
            --config-file .config/nextest.toml \
            --cargo-quiet \
            --failure-output final \
            --no-tests pass

      - name: Save Cargo registry cache
        if: always() && (github.ref_name == 'master' || steps.cargo-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Collect test observability artifacts
        if: always()
        uses: $/.github/actions/observability
        with:
          artifact-name: kat-test-observability-ubuntu-latest
          summary-title: Test observability
          output-dir: ${{ runner.temp }}/kat-test-observability
          link-log: ${{ runner.temp }}/test-rust-link-timings.tsv

      - name: Upload test observability artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kat-test-observability-ubuntu-latest
          path: ${{ runner.temp }}/kat-test-observability
          if-no-files-found: warn

  ghostty-e2e:
    name: ghostty-e2e (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore Cargo registry cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up mise toolchain
        uses: jdx/mise-action@v5

      - name: Set up native image dependencies
        uses: $/.github/actions/setup-native-image-deps

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable sccache integration
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            echo "CC=sccache cc"
            echo "CXX=sccache c++"
          } >> "${GITHUB_ENV}"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run Ghostty terminal e2e
        shell: bash
        run: |
          set -euo pipefail
          "${SCCACHE_PATH}" --zero-stats
          scripts/with-zig-download-retry.sh cargo nextest run \
            --workspace \
            --features ghostty-e2e \
            --test ghostty_terminal_e2e \
            --config-file .config/nextest.toml

      - name: Save Cargo registry cache
        if: always() && (github.ref_name == 'master' || steps.cargo-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  ci-required:
    name: CI required
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - ghostty-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON" | jq .
          printf '%s\n' "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")'
