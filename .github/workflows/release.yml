name: Release latest

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - master
    types:
      - completed

concurrency:
  group: release-latest
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release-latest:
    name: release latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download latest release packages
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: kat-release-package-*
          path: ${{ runner.temp }}/latest-release-assets
          merge-multiple: true

      - name: Move latest tag to current commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          git tag -f latest "${RELEASE_SHA}"
          git push --force origin refs/tags/latest

      - name: Publish latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_DIR: ${{ runner.temp }}/latest-release-assets
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/latest-release-notes.md"

          cat > "${notes_file}" <<EOF
          latest channel for the current master tip.

          - Branch: \`master\`
          - Commit: \`${RELEASE_SHA}\`
          - Commit URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${RELEASE_SHA}
          EOF

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "latest" \
              --notes-file "${notes_file}" \
              --prerelease
          else
            gh release create latest \
              --title "latest" \
              --notes-file "${notes_file}" \
              --prerelease \
              --latest=false \
              --target "${RELEASE_SHA}"
          fi

          gh release upload latest "${RELEASE_ASSET_DIR}"/* --clobber

          # Keep latest assets aligned with the current build matrix and archive format.
          gh release view latest --json assets \
            --jq '.assets[].name | select(startswith("kat-"))' \
            > "${RUNNER_TEMP}/latest-release-package-names.txt"
          while IFS= read -r asset; do
            if [[ ! -f "${RELEASE_ASSET_DIR}/${asset}" ]]; then
              gh release delete-asset latest "${asset}" --yes
            fi
          done < "${RUNNER_TEMP}/latest-release-package-names.txt"
