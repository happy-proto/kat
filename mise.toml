[tools]
hk = { version = "2.5.0", workflow = "release.yml" }
zig = "0.16.0"

[settings]
activate_aggressive = true

[tasks.test]
description = "运行脚本回归与 workspace 测试"
run = '''
#!/usr/bin/env bash
set -euo pipefail
uv run --script scripts/check-config.py --self-test
bash scripts/tests/zig-download-retry.sh
extra_args=()
if [ "${KAT_AGENT_TEST_LOG_MODE:-}" = "quiet" ]; then
  extra_args=(--status-level fail --final-status-level fail --success-output never --show-progress none)
fi
cargo nextest run --workspace --config-file .config/nextest.toml --cargo-quiet --failure-output final --no-tests pass "${extra_args[@]}"
'''

[tasks.ghostty-e2e]
description = "运行真实 PTY 与 Ghostty 端到端测试"
run = "scripts/with-zig-download-retry.sh cargo nextest run --workspace --features ghostty-e2e --test ghostty_terminal_e2e --config-file .config/nextest.toml"

[tasks.compact-release]
description = "构建紧凑 parser 静态发布二进制"
run = '''
#!/usr/bin/env bash
set -euo pipefail
compact_cargo_home=$(mktemp -d)
trap 'rm -rf "$compact_cargo_home"' EXIT
export CARGO_HOME="$compact_cargo_home"
export SYSTEM_DEPS_DAV1D_LINK=static
export SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always
cargo fetch --locked
uv run --script scripts/compact_parser_tables.py --manifest-path Cargo.toml --cargo-home "$CARGO_HOME"
cargo build --release --locked --features compact-parser-tables
'''

[tasks.perf]
description = "运行仓库性能基线"
usage = 'arg "[iterations]" default="3" help="每个样例的运行次数"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --release --quiet
KAT_PERF_ITERATIONS="$usage_iterations" ./scripts/perf-baseline.sh
'''

[tasks.perf-file]
description = "运行单文件性能基线"
usage = '''
arg "<path>" help="基于仓库根目录的输入文件路径"
arg "[iterations]" default="3" help="运行次数"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --release --quiet
KAT_PERF_ITERATIONS="$usage_iterations" ./scripts/perf-baseline.sh "$usage_path"
'''

[tasks.showcase]
description = "查看全部或指定高亮样例"
raw = true
usage = 'arg "[path]" help="要查看的样例路径；省略时查看全部样例"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --quiet
bin=target/debug/kat
divider='================================================================'
show_file() {
  printf '\n%s\nSHOWCASE: %s\n%s\n\n' "$divider" "$1" "$divider"
  "$bin" "$1"
  printf '\n'
}
if [ -n "${usage_path:-}" ]; then
  show_file "$usage_path"
else
  find testdata/showcase -type f | sort | while IFS= read -r file; do
    show_file "$file"
  done
fi
'''

[tasks.install]
description = "从当前 checkout 安装 kat"
run = "cargo install --path . --locked"
