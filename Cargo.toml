[package]
name = "kat"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/happy-proto/kat"
default-run = "kat"

[workspace]
members = ["tools/validate-grammar-registry"]
resolver = "2"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/latest/kat-{ target }{ archive-suffix }"
bin-dir = "kat-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[package.metadata.binstall.overrides.'cfg(not(target_os = "windows"))']
pkg-fmt = "txz"

[[bin]]
name = "kat"
path = "src/main.rs"
required-features = ["terminal-images"]

[dependencies]
anstyle = "1.0.14"
anyhow = "1.0.104"
base64 = { version = "0.23.1", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
icy_sixel = { version = "0.7.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "qoi", "pnm", "ff", "hdr", "dds", "avif-native"], optional = true }
libghostty-vt = { default-features = false, optional = true, git = "https://github.com/uzaaft/libghostty-rs", rev = "d2036baeb605d31d09a9e2ba6d0c923e04c34d54" }
miette = { version = "7.6.0", features = ["fancy"] }
portable-pty = { version = "0.9.0", optional = true }
resvg = { version = "0.48.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shadow-rs = { version = "2.0.0", default-features = false }
signal-hook = "0.4.5"
terminal_size = "0.4.4"
termwiz = { git = "https://github.com/DCjanus/wezterm.git", branch = "feat/upstream-termwiz-default-color-probe" }
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-kat-parsers = { git = "https://github.com/happy-proto/kat-parsers", branch = "feat/nushell" }
tree-sitter-language = "0.1.9"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[build-dependencies]
shadow-rs = { version = "2.0.0", default-features = false, features = ["build"] }

[features]
default = ["terminal-images"]
ghostty-e2e = ["dep:libghostty-vt", "dep:portable-pty"]
terminal-images = ["dep:base64", "dep:icy_sixel", "dep:image", "dep:resvg"]

[target."cfg(unix)".dependencies]
termios = "0.3.3"
